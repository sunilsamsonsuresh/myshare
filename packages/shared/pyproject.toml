[project]
name = "myshare-shared"
version = "0.1.0"
description = "Shared helpers (money parsing/formatting, LangSmith tracing setup)"
requires-python = ">=3.12"
dependencies = [
    "langsmith==0.14.12",
    "pydantic==2.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["myshare_shared"]
