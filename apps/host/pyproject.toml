[project]
name = "myshare-host"
version = "0.1.0"
description = "MyShare MCP host: LangGraph agent + hand-built MCP client"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.159.1",
    "httpx==0.28.1",
    "langchain-anthropic==1.7.6",
    "langchain-core==1.6.13",
    "langgraph==1.2.16",
    "langgraph-checkpoint-sqlite==3.1.2",
    "langsmith==0.14.12",
    "mcp==2.3.0",
    "myshare-shared",
    "pydantic-settings==2.16.1",
    "python-dotenv==1.2.4",
    "uvicorn[standard]==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["myshare_host"]

[tool.uv.sources]
myshare-shared = { workspace = true }
