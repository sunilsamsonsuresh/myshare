[project]
name = "myshare-mcp"
version = "0.1.0"
description = "MyShare MCP server: thin adapter over the REST API"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "mcp==2.3.0",
    "myshare-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["myshare_mcp"]

[tool.uv.sources]
myshare-shared = { workspace = true }
