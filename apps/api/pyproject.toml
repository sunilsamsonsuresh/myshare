[project]
name = "myshare-api"
version = "0.1.0"
description = "MyShare REST API (source of truth)"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi==25.1.0",
    "email-validator==2.3.0",
    "fastapi==0.159.1",
    "myshare-shared",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "pyjwt==2.15.1",
    "sqlalchemy==2.1.6",
    "uvicorn[standard]==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["myshare_api"]

[tool.uv.sources]
myshare-shared = { workspace = true }
